# Configuración Nginx para EcoAula (Proxy Inverso con SSL/TLS)
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name 3-237-185-159.sslip.io _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name 3-237-185-159.sslip.io;
    client_max_body_size 30M;

    ssl_certificate /etc/letsencrypt/live/3-237-185-159.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/3-237-185-159.sslip.io/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        # Inyección forzada de IP real para evitar spoofing en el limitador de tasa
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
