name: EcoAula CI

on:
  push:
    branches: [ main, develop, 'feature/**' ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build:
    name: Build & Verify (Autónomo sin Docker)
    runs-on: ubuntu-latest
    env:
      # Si el secreto no existe (por ejemplo, antes de configurar SonarCloud), el análisis se omite
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_MAVEN_PLUGIN: org.sonarsource.scanner.maven:sonar-maven-plugin:4.0.0.4121
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4
        with:
          # Historial completo: SonarCloud lo usa para distinguir el código nuevo
          fetch-depth: 0

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Dar permisos de ejecución al wrapper de Maven
        run: chmod +x mvnw

      # verify ejecuta las pruebas y jacoco:check: falla si la cobertura baja de los umbrales del pom.xml
      - name: Compilar, probar y verificar cobertura (H2)
        run: ./mvnw -B verify

      - name: Caché de SonarCloud
        if: env.SONAR_TOKEN != ''
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      # Reutiliza las clases y el reporte de JaCoCo del paso anterior; falla si no se pasa el Quality Gate
      - name: Análisis SonarCloud y Quality Gate
        if: env.SONAR_TOKEN != ''
        run: ./mvnw -B ${SONAR_MAVEN_PLUGIN}:sonar -Dsonar.qualitygate.wait=true

      - name: Aviso de SonarCloud sin configurar
        if: env.SONAR_TOKEN == ''
        run: echo "::notice title=SonarCloud::Análisis omitido. Configure el secreto SONAR_TOKEN (ver docs/CALIDAD_CI.md)."

      - name: Publicar reporte de cobertura JaCoCo
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reporte-cobertura-jacoco
          path: target/site/jacoco/
          if-no-files-found: warn

  integracion-mysql:
    name: Integración MySQL 8 (Docker Compose ADR-04)
    runs-on: ubuntu-latest
    needs: build

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root_secret
          MYSQL_DATABASE: ecoaula_db
          MYSQL_USER: ecoaula_user
          MYSQL_PASSWORD: ecoaula_secret
        ports:
          - 3307:3306
        options: --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot_secret" --health-interval=10s --health-timeout=5s --health-retries=10

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Dar permisos de ejecución al wrapper de Maven
        run: chmod +x mvnw

      - name: Ejecutar pruebas de integración con MySQL (Perfil integracion-mysql)
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3307
          DB_NAME: ecoaula_db
          DB_USER: ecoaula_user
          DB_PASSWORD: ecoaula_secret
        run: ./mvnw -B verify -Pintegracion-mysql
