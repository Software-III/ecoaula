<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión — EcoAula</title>
    <link rel="stylesheet" th:href="@{/css/ecoaula.css}">
</head>
<body th:class="${(perfilAccesibilidad != null and perfilAccesibilidad.modoVisual != null and perfilAccesibilidad.modoVisual.name() == 'ALTO_CONTRASTE' ? 'modo-alto-contraste ' : '') + (perfilAccesibilidad != null and perfilAccesibilidad.tamanoTexto != null and perfilAccesibilidad.tamanoTexto.name() == 'GRANDE' ? 'texto-grande ' : '')}">

    <a href="#contenido-principal" class="skip-link">Saltar al contenido principal</a>

    <header class="encabezado-sitio" role="banner">
        <div class="contenedor-principal">
            <div style="font-size: 1.5rem; font-weight: bold;">
                <a th:href="@{/cursos}" style="text-decoration: none; color: inherit;">EcoAula</a>
            </div>
        </div>
    </header>

    <main id="contenido-principal" class="contenedor-principal" role="main" tabindex="-1">
        <h1>Iniciar Sesión</h1>

        <!-- Alertas de estado y mensajes -->
        <div th:if="${mensajeError != null}" class="alerta alerta-error" role="alert" th:text="${mensajeError}"></div>
        <div th:if="${mensajeExito != null}" class="alerta alerta-exito" role="status" aria-live="polite" th:text="${mensajeExito}"></div>

        <p>Ingrese sus credenciales de acceso para continuar con sus cursos y evaluaciones.</p>

        <form th:action="@{/login}" method="post" novalidate style="margin-top: 1.5rem;">
            <div class="grupo-campo">
                <label for="correo">Correo electrónico</label>
                <input type="email" id="correo" name="correo" required autocomplete="username" autofocus>
            </div>

            <div class="grupo-campo">
                <label for="password">Contraseña</label>
                <input type="password" id="password" name="password" required autocomplete="current-password">
            </div>

            <div style="margin-top: 2rem;">
                <button type="submit" class="boton-principal">Entrar a mi cuenta</button>
            </div>
        </form>

        <div style="margin-top: 2.5rem; border-top: 2px solid var(--color-borde); padding-top: 1.5rem;">
            <h2>¿No tiene una cuenta?</h2>
            <p>El registro es gratuito, accesible y le permite configurar sus preferencias de lectura y audio.</p>
            <a th:href="@{/registro}" class="boton-secundario">Crear una cuenta nueva</a>
        </div>
    </main>

</body>
</html>
