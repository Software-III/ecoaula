<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${titulo != null ? titulo + ' — EcoAula' : 'EcoAula — Plataforma de Aprendizaje Accesible'}">EcoAula</title>
    <link rel="stylesheet" th:href="@{/css/ecoaula.css}">
</head>
<body th:class="${(perfilAccesibilidad != null and perfilAccesibilidad.modoVisual != null and perfilAccesibilidad.modoVisual.name() == 'ALTO_CONTRASTE' ? 'modo-alto-contraste ' : '') + (perfilAccesibilidad != null and perfilAccesibilidad.tamanoTexto != null and perfilAccesibilidad.tamanoTexto.name() == 'GRANDE' ? 'texto-grande ' : '') + (perfilAccesibilidad != null and perfilAccesibilidad.soloAudio ? 'solo-audio ' : '')}">

    <!-- Enlace accesible de salto al contenido -->
    <a href="#contenido-principal" class="skip-link">Saltar al contenido principal</a>

    <!-- Encabezado y navegación principal -->
    <header class="encabezado-sitio" role="banner">
        <div class="contenedor-principal" style="padding-top: 0; padding-bottom: 0;">
            <div style="font-size: 1.5rem; font-weight: bold;">
                <a th:href="@{/cursos}" style="text-decoration: none; color: inherit;">EcoAula</a>
            </div>
            <nav class="navegacion-principal" role="navigation" aria-label="Navegación principal">
                <ul>
                    <li><a th:href="@{/cursos}">Catálogo de Cursos</a></li>
                    <li sec:authorize="isAuthenticated()"><a th:href="@{/perfil}">Mi Perfil de Accesibilidad</a></li>
                    <li sec:authorize="isAnonymous()"><a th:href="@{/registro}">Registrarme</a></li>
                    <li sec:authorize="isAnonymous()"><a th:href="@{/login}">Iniciar Sesión</a></li>
                    <li sec:authorize="isAuthenticated()">
                        <form th:action="@{/logout}" method="post" style="display: inline;">
                            <button type="submit" class="boton-secundario" style="min-height: 38px; padding: 0.25rem 0.75rem; font-size: 1rem;">Cerrar Sesión</button>
                        </form>
                    </li>
                </ul>
            </nav>
        </div>
    </header>

    <!-- Región principal de contenido -->
    <main id="contenido-principal" class="contenedor-principal" role="main" tabindex="-1">

        <!-- Mensajes de estado / Feedback con aria-live -->
        <div th:if="${mensajeExito != null}" class="alerta alerta-exito" role="status" aria-live="polite" th:text="${mensajeExito}"></div>
        <div th:if="${mensajeError != null}" class="alerta alerta-error" role="alert" th:text="${mensajeError}"></div>

        <!-- Fragmento de contenido inyectado por cada vista -->
        <th:block th:replace="${contenido}"></th:block>

    </main>

</body>
</html>
