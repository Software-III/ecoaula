spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3307}/${DB_NAME:ecoaula_db}?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false&readOnlyPropagatesToServer=false
    username: ${DB_USER:ecoaula_user}
    password: ${DB_PASSWORD:ecoaula_secret}
  jpa:
    hibernate:
      ddl-auto: ${HIBERNATE_DDL_AUTO:update}
    show-sql: false

ecoaula:
  seguridad:
    clave-cifrado: ${ECOAULA_CLAVE_CIFRADO}
