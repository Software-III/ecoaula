spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3307}/${DB_NAME:ecoaula_db}?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false&readOnlyPropagatesToServer=false
    username: ${DB_USER:ecoaula_user}
    password: ${DB_PASSWORD:ecoaula_secret}
  jpa:
    hibernate:
      ddl-auto: ${HIBERNATE_DDL_AUTO:update}
    show-sql: false

ecoaula:
  seguridad:
    clave-cifrado: ${ECOAULA_CLAVE_CIFRADO}
  # Cuentas demo en producción: solo se crean las que tengan su variable de entorno con una contraseña
  # propia (12 o más caracteres, distinta de las de desarrollo). No se restablecen al arrancar.
  seed:
    habilitado: ${ECOAULA_SEED_HABILITADO:true}
    sincronizar-contrasenas: ${ECOAULA_SEED_SINCRONIZAR_CONTRASENAS:false}
    aprendiz-password: ${ECOAULA_SEED_APRENDIZ_PASSWORD:}
    gestor-password: ${ECOAULA_SEED_GESTOR_PASSWORD:}
    revisor-password: ${ECOAULA_SEED_REVISOR_PASSWORD:}
    coordinador-password: ${ECOAULA_SEED_COORDINADOR_PASSWORD:}
